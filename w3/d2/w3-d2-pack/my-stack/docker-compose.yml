version: '3.8'

services:
  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - api-gateway

  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - payment-svc
      - inventory-svc
      - notification-svc
      - checkout-svc
      - auth-svc
      - dns-resolver
      - cache-svc

  payment-svc:
    build: ./payment-svc
    depends_on:
      - payment-db

  payment-db:
    image: postgres:13
    environment:
      POSTGRES_DB: payment
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password

  inventory-svc:
    build: ./inventory-svc
    depends_on:
      - inventory-db

  inventory-db:
    image: postgres:13
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password

  notification-svc:
    build: ./notification-svc
    depends_on:
      - kafka

  kafka:
    image: confluentinc/cp-kafka:7.0.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper

  zookeeper:
    image: confluentinc/cp-zookeeper:7.0.0
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  checkout-svc:
    build: ./checkout-svc
    depends_on:
      - payment-svc
      - inventory-svc

  auth-svc:
    build: ./auth-svc

  log-collector:
    build: ./log-collector

  dns-resolver:
    build: ./dns-resolver

  cache-svc:
    build: ./cache-svc

  prometheus:
    build: ./prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:10.4.0
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: true
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    depends_on:
      - prometheus

  alertmanager:
    build: ./alertmanager
    ports:
      - "9093:9093"
  aiops-pipeline:
    build: ../pipeline
    ports:
      - "8000:8000"
    depends_on:
      - prometheus
      - alertmanager
